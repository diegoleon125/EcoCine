<html>
    <head>
        <meta charset="UTF-8">
        <title>Dulcería - EcoCine</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="/EcoCine/style.css">
        <link rel="icon" href="/EcoCine/src/icon.png">
        <script type="module" src="/EcoCine/scripts/Layout.js" defer></script>
        <script type="module" src="/EcoCine/dulceria/dulceria.js"></script>
    </head>
    <body>
        <custom-header></custom-header>

        <main>
            <h1>SNACKS</h1>

            <section id="grid-dulceria" class="grid-section grid-6-7 grid-dulceria">
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="/EcoCine/dulceria/src/SHOTDOG.png" alt="snack">
                    <h3>Hotdog</h3>
                    <p>S/10.00</p>
                </button>
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="/EcoCine/dulceria/src/SMNM.png" alt="snack">
                    <h3>M&M's</h3>
                    <p>S/7.00</p>
                </button>
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="/EcoCine/dulceria/src/SNACHOS.png" alt="snack">
                    <h3>Nachos</h3>
                    <p>S/6.99</p>
                </button>
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="/EcoCine/dulceria/src/SPRINGLES.png" alt="snack">
                    <h3>Pringles</h3>
                    <p>S/9.50</p>
                </button>
            </section>
        </main>

        <custom-footer></custom-footer>
    </body>
</html>

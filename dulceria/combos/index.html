<html>
    <head>
        <meta charset="UTF-8">
        <title>Dulcería - EcoCine</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="/EcoCine/style.css">
        <link rel="icon" href="/EcoCine/src/icon.png">
        <script type="module" src="/EcoCine/scripts/Layout.js" defer></script>
        <script type="module" src="/EcoCine/dulceria/dulceria.js"></script>
    </head>
    <body>
        <custom-header></custom-header>

        <main>
            <h1>COMBOS</h1>

            <section id="grid-dulceria" class="grid-section grid-6-7 grid-dulceria grid-combos">
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="/EcoCine/dulceria/src/CO1.png" alt="combo">
                    <h3>COMBO1: Cancha Regular + Gaseosa Regular</h3>
                    <p>S/. 11.99</p>
                </button>
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="/EcoCine/dulceria/src/CO2.png" alt="combo">
                    <h3>COMBO2: Cancha Grande + 2 Gaseosas Medianas</h3>
                    <p>S/. 40.99</p>
                </button>
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="/EcoCine/dulceria/src/CO3.png" alt="combo">
                    <h3>COMBO3: 2 Canchas Regulares + 2 Gaseosas Medianas</h3>
                    <p>S/. 22.99</p>
                </button>
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="/EcoCine/dulceria/src/CC.png" alt="canchita">
                    <h3>Cancha Regular</h3>
                    <p>S/. 7.99</p>
                </button>
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="/EcoCine/dulceria/src/CG.png" alt="canchita">
                    <h3>Cancha Grande</h3>
                    <p>S/. 20.99</p>
                </button>
            </section>
        </main>

        <custom-footer></custom-footer>
    </body>
</html>

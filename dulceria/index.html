<html>
    <head>
        <meta charset="UTF-8">
        <title>Dulcería - EcoCine</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="/EcoCine/style.css">
        <link rel="icon" href="/EcoCine/src/icon.png">
        <script type="module" src="/EcoCine/scripts/Layout.js" defer></script>
    </head>
    <body>
        <custom-header></custom-header>

        <main>
            <h1>Dulcería</h1>
            <section class="card card-1 flex-reverse">
                <div class="div-img div-img-reverse">
                    <img src="/EcoCine/dulceria/src/combos.jpeg" alt="Cines">
                </div>
                <div class="div-info">
                    <div class="div-txt">
                        <h1>Combos</h1>
                        <p>
                            Disfruta nuestros combos ecoamigables con la mejor combinación para tu función.
                        </p>
                        <a class="page-a page-btn bg-1" href="/EcoCine/dulceria/combos">Ver combos &RightArrow;</a>
                    </div>
                </div>
            </section>

            <section class="card card-1">
                <div class="div-img div-img-normal">
                    <img src="/EcoCine/dulceria/src/bebidas.jpeg" alt="Dulcería">
                </div>
                <div class="div-info">
                    <div class="div-txt">
                        <h1>Bebidas</h1>
                        <p>
                            Refresca tu experiencia con bebidas deliciosas y sostenibles.
                        </p>
                        <a class="page-a page-btn bg-1" href="/EcoCine/dulceria/bebidas">Ver bebidas &RightArrow;</a>
                    </div>
                </div>
            </section>
            
            <section class="card card-1 flex-reverse">
                <div class="div-img div-img-reverse">
                    <img src="/EcoCine/dulceria/src/snacks.jpeg" alt="Cines">
                </div>
                <div class="div-info">
                    <div class="div-txt">
                        <h1>Snacks</h1>
                        <p>
                            Encuentra snacks irresistibles para acompañar cada momento de tu película.
                        </p>
                        <a class="page-a page-btn bg-1" href="/EcoCine/dulceria/snacks">Ver snacks &RightArrow;</a>
                    </div>
                </div>
            </section>
        </main>

        <custom-footer></custom-footer>
    </body>
</html>

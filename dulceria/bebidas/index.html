<html>
    <head>
        <meta charset="UTF-8">
        <title>Dulcería - EcoCine</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="src/icon.png">
        <script type="module" src="scripts/Layout.js" defer></script>
        <script type="module" src="dulceria/dulceria.js"></script>
    </head>
    <body>
        <custom-header></custom-header>

        <main>
            <h1>BEBIDAS</h1>
            <section id="grid-dulceria" class="grid-section grid-6-7 grid-dulceria">
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="dulceria/src/B0C.png" alt="bebida">
                    <h3>Gaseosa Regular</h3>
                    <p>S/5.00</p>
                </button>
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="dulceria/src/B0M.png" alt="bebida">
                    <h3>Gaseosa Mediana</h3>
                    <p>S/7.00</p>
                </button>
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="dulceria/src/B0G.png" alt="bebida">
                    <h3>Gaseosa Grande</h3>
                    <p>S/9.99</p>
                </button>
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="dulceria/src/BCAFE.png" alt="bebida">
                    <h3>Café</h3>
                    <p>S/4.00</p>
                </button>
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="dulceria/src/BAGUA.png" alt="bebida">
                    <h3>Agua</h3>
                    <p>S/3.00</p>
                </button>
                <button class="card flex-column page-a" onclick="toggleProduct(this,12022)">
                    <img src="dulceria/src/BCHICHA.png" alt="bebida">
                    <h3>Chicha</h3>
                    <p>S/5.00</p>
                </button>
            </section>
        </main>

        <custom-footer></custom-footer>
    </body>
</html>

<html>
    <head>
        <meta charset="UTF-8">
        <title>Cines - EcoCine</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="/EcoCine/style.css">
        <link rel="icon" href="/EcoCine/src/icon.png">
        <script type="module" src="/EcoCine/main.js" defer></script>
        <script type="module" src="./cines.js"></script>
    </head>
    <body>
        <custom-header></custom-header>

        <main>
            <h1>CINES</h1>
            <h2>Escoja su cine antes de buscar horarios!</h2>
            <article id="grid-cinemas" class="grid-section grid-1-1">
                <button class="card-img page-btn flex-column" onclick="setCinema('SJL')">
                    <img src="/EcoCine/cines/src/sjl.jpg" alt="">
                    <h2>EC SJL</h2>
                </button>
                <button class="card-img page-btn flex-column" onclick="setCinema('LimaCentro')">
                    <img src="/EcoCine/cines/src/limacentro.jpg" alt="">
                    <h2>EC Lima Centro</h2>
                </button>
                <button class="card-img page-btn flex-column" onclick="setCinema('Miraflores')">
                    <img src="/EcoCine/cines/src/miraflores.jpg" alt="">
                    <h2>EC Miraflores</h2>
                </button>
                <!-- Solo para pruebas-->
                <button class="card-img" onclick="clearCinema()" style="aspect-ratio: 3;">
                    borrar cine
                </button>
            </article>
        </main>

        <custom-footer></custom-footer>
    </body>
</html>
